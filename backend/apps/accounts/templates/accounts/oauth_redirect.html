<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url={{ redirect_url }}">
    <title>Redirecting back to application…</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f5f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #111827;
            padding: 16px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            padding: 28px;
            text-align: center;
        }
        a {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Authorization Complete</h2>
        <p>Returning you to your AI assistant…</p>
        <a id="continue-link" href="{{ redirect_url }}">Continue</a>
    </div>
    {{ redirect_url|json_script:"oauth-redirect-url" }}
    <script>
        (function () {
            var el = document.getElementById("oauth-redirect-url");
            if (el) {
                var target = JSON.parse(el.textContent);
                window.location.replace(target);
            }
        })();
    </script>
</body>
</html>
